<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SquadPass – party tickets that get cheaper with friends</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#F7F5FC;--paper:#090610;--card:#100B1B;--line:#251C3A;--mute:#9A8FB8;--pink:#9461E8;--gold:#FFC83D;--ok:#3CC8F0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1000px 500px at 50% -15%,#2a1a5655,transparent),var(--paper);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.logo,.big,.stat b{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1.05}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:26px}
.logo{font-size:26px;cursor:pointer}.gt,.logo b{background:linear-gradient(90deg,#9461E8,#3CC8F0);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:2px}nav button{background:none;border:0;color:var(--mute);text-transform:uppercase;letter-spacing:.14em;font:600 12px Inter,sans-serif;padding:8px 12px;cursor:pointer}
nav button[aria-current=true]{color:var(--pink)}
.hero{text-align:center;padding:40px 0 20px}.hero h1{font-size:clamp(44px,10vw,100px)}.hero p{color:var(--mute);max-width:34em;margin:16px auto 0}
.panel,.ev,.stat,.tk{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px;margin-bottom:14px}
.ev{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.ev h3{font-size:22px}
.meta{color:var(--mute);font-size:14px}.note{font-size:13px;color:var(--mute);margin-top:10px}.msg{margin-top:10px;font-weight:600}
.tiers{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tier{font-size:13px;font-weight:600;border:1px dashed var(--line);border-radius:3px;padding:3px 9px}.tier.hot{border:1px solid var(--pink);color:var(--pink)}
.btn{border:0;border-radius:3px;padding:11px 18px;background:var(--pink);color:#fff;text-transform:uppercase;letter-spacing:.1em;font:700 13px Inter,sans-serif;cursor:pointer}
.btn.alt{background:transparent;border:1px solid #2f2447}.btn.sm{padding:7px 12px}.btn:disabled{opacity:.4}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-width:0;width:100%}
label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input{flex:1 1 150px}
.big{font-size:clamp(46px,10vw,76px);background:linear-gradient(90deg,#9461E8,#3CC8F0);-webkit-background-clip:text;background-clip:text;color:transparent}.big s{font-size:.4em;-webkit-text-fill-color:var(--mute);margin-left:8px}
.bar{position:relative;height:18px;background:var(--line);border-radius:99px;margin:26px 0 32px}.fill{height:100%;background:linear-gradient(90deg,#9461E8,#3CC8F0);border-radius:99px;transition:width .5s}
.mk{position:absolute;top:-6px;width:2px;height:30px;background:var(--ink)}.mk span{position:absolute;top:32px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;color:var(--mute)}
.mem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.mem:last-child{border:0}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:3px;background:var(--line)}.tag.g{background:var(--ok);color:#04141c}.tag.w{background:var(--gold);color:#201600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}.stat b{display:block;font-size:30px}.stat span{font-size:13px;color:var(--mute)}
.tk{display:flex;gap:14px;align-items:center;border-left:3px solid var(--pink)}.tk canvas{background:#fff;border-radius:4px;padding:4px;width:120px!important;height:120px!important;flex:none}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500}
.dh{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--pink);font-weight:600;margin:26px 0 10px}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow:auto}.md h3{font-size:30px}
.pqr{max-width:240px;width:100%;background:#fff;padding:8px;border-radius:6px;display:block;margin:12px 0}
#reader{max-width:320px;margin-top:10px}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
@media(max-width:560px){.ev{grid-template-columns:1fr}.tk{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo" data-go="events" tabindex="0">squad<b>pass</b></div><nav aria-label="Switch view"><button data-go="events" id="n1">Students</button><button data-go="organizer" id="n2">Organizer</button></nav></header>
<div id="err" role="status"></div>
<main id="app"><p class="meta">Loading…</p></main>
<footer>SquadPass · College project. Pay the organizer directly by UPI. Tickets become valid only after the organizer approves your payment.</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
// 1) PASTE YOUR SUPABASE DETAILS (Project Settings -> API). The anon key is meant to be public.
const CFG={url:'https://aeaequqbiigwclcgbwav.supabase.co',key:'sb_publishable_JDSLw_IqYTs3c5vGok8R2g_HDk0veNT'};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
let db=null,D={ev:[],sq:[],mem:[],qr:null,views:0},user=null,lastR=null,scanner=null,lastScan='';
try{db=supabase.createClient(CFG.url,CFG.key)}catch(e){}
const say=(m,ok)=>{$('#err').innerHTML=m?`<div class="panel" style="border-color:${ok?'var(--ok)':'var(--gold)'}">${esc(m)}</div>`:''};
const price=(e,n)=>Math.round(e.price*(1-(n>=10?e.pct10:n>=5?e.pct5:0)/100));
const mOf=s=>D.mem.filter(m=>m.squad_id===s.id);
const evOf=id=>D.ev.find(e=>e.id===id);
const sqOf=id=>D.sq.find(s=>s.id===id);
const taken=e=>D.mem.filter(m=>m.status!=='reserved'&&sqOf(m.squad_id)?.event_id===e.id).length;
const mPrice=m=>{const s=sqOf(m.squad_id),e=s&&evOf(s.event_id);return e?price(e,mOf(s).length):0};
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});
const cur=()=>location.hash.slice(1)||'events';

async function load(){
  if(!db||CFG.url.startsWith('PASTE'))throw new Error('Setup needed: add your Supabase URL and anon key at the top of the script.');
  const r=await Promise.all([db.from('events').select('*').order('date'),db.from('squads').select('*'),db.from('members').select('*'),db.from('settings').select('qr').eq('id',1).maybeSingle()]);
  const bad=r.find(x=>x.error);if(bad)throw new Error('Could not load data: '+bad.error.message);
  D.ev=r[0].data||[];D.sq=r[1].data||[];D.mem=r[2].data||[];D.qr=(r[3].data&&r[3].data.qr)||null;
  const ss=await db.auth.getSession();user=(ss.data&&ss.data.session&&ss.data.session.user)||null;
  if(user){const v=await db.from('views').select('id',{count:'exact',head:true});D.views=v.count||0}
}
async function act(f){try{say('');await f()}catch(e){say(e&&e.message?e.message:'Something went wrong. Please try again.')}}
async function refresh(){await load();paint()}

function evView(){
  const today=new Date().toISOString().slice(0,10),up=D.ev.filter(e=>e.date>=today);
  let h=`<section class="hero"><h1>Unlock bigger<br><span class="gt">squad discounts</span></h1><p>Start a squad, share the link, and the ticket price drops for everyone as friends join.</p></section>`;
  if(!up.length)return h+`<div class="panel"><strong>No parties listed yet.</strong><div class="meta">Check back soon. Organizers can add events from the Organizer tab.</div></div>`;
  let last='';
  up.forEach(e=>{
    if(e.date!==last){h+=`<div class="dh">${fmt(e.date)}</div>`;last=e.date}
    const left=Math.max(0,e.cap-taken(e));
    h+=`<article class="ev"><div><h3>${esc(e.name)}</h3><div class="meta">${esc(e.venue||'')} · ${left} of ${e.cap} passes left</div>
    <div class="tiers"><span class="tier">Solo ${inr(e.price)}</span><span class="tier">Squad of 5: ${inr(price(e,5))}</span><span class="tier hot">Squad of 10: ${inr(price(e,10))} · Best value</span></div></div>
    <button class="btn" data-act="newsq" data-id="${e.id}">Start a squad</button></article>`});
  return h;
}

function sqView(s){
  const e=evOf(s.event_id);
  if(!e)return `<div class="panel">This event is no longer available.</div>`;
  const ms=mOf(s),n=ms.length,p=price(e,n),need=n<5?5-n:n<10?10-n:0,nextP=n<5?price(e,5):n<10?price(e,10):0;
  const alts=D.ev.filter(x=>x.date===e.date&&x.id!==e.id);
  let h=`<a href="#events" class="meta">← All events</a>
  <section class="panel" style="margin-top:10px"><div class="meta">${esc(e.name)} · ${fmt(e.date)}</div><h2 style="font-size:30px;margin:6px 0 14px">${esc(s.name)}</h2>
  <div class="big">${inr(p)}<s>${p<e.price?inr(e.price):''}</s></div>
  <div class="meta">per person${need&&!s.locked?` · ${need} more friend${need>1?'s':''} to drop it to ${inr(nextP)}`:''}</div>
  <div class="bar"><div class="fill" style="width:${Math.min(100,n*10)}%"></div><div class="mk" style="left:50%"><span>5 · ${inr(price(e,5))}</span></div><div class="mk" style="right:0"><span>10 · ${inr(price(e,10))}</span></div></div>
  <strong>${n}/10 joined</strong>${s.locked?' · <span class="tag g">Squad locked</span>':''}</section>`;
  if(!s.locked){
    h+=`<section class="panel"><h3 style="font-size:20px">Add friends</h3><div class="row" style="margin-top:12px"><input id="fn" placeholder="Friend’s name" aria-label="Friend’s name"><button class="btn" data-act="add">Add to squad</button></div>
    <div class="row" style="margin-top:8px"><button class="btn alt" data-act="copy">Copy invite link</button></div><div class="msg" id="msg"></div>
    <div style="margin-top:10px">${ms.map(m=>`<div class="mem"><span>${esc(m.name)}${m.name===s.leader?' (leader)':''}</span><span class="tag">Reserved</span></div>`).join('')}</div></section>`;
    if(alts.length)h+=`<section class="panel"><h3 style="font-size:20px">Other parties that night</h3><div class="row" style="margin-top:10px"><select id="sw">${alts.map(a=>`<option value="${a.id}">${esc(a.name)} · ${inr(a.price)}</option>`).join('')}</select><button class="btn alt" data-act="move">Move squad</button></div></section>`;
    h+=`<section class="panel"><h3 style="font-size:20px">Lock your squad</h3><p class="meta">Locking fixes the price at ${inr(p)} each. Nobody can join after that, and everyone then pays the organizer by UPI.</p><button class="btn" data-act="lock" ${n<2?'disabled':''}>Lock at ${inr(p)} each</button></section>`;
  }else{
    h+=`<section class="panel"><h3 style="font-size:20px;margin-bottom:6px">Pay and get tickets</h3><p class="meta">Pay ${inr(p)} per person. Your ticket appears once the organizer approves your payment.</p>`+
    ms.map(m=>`<div class="mem"><span>${esc(m.name)}</span>${m.status==='reserved'?`<button class="btn sm" data-act="pay" data-id="${m.id}">Pay ${inr(p)}</button>`:m.status==='pending'?'<span class="tag w">Waiting for organizer</span>':'<span class="tag g">Paid</span>'}</div>`).join('')+`</section>`;
    const ok=ms.filter(m=>m.status==='approved');
    if(ok.length)h+=`<section class="panel"><h3 style="font-size:20px;margin-bottom:12px">Tickets</h3>${ok.map(m=>`<div class="tk"><canvas data-t="${esc(m.code)}"></canvas><div><strong>${esc(m.name)}</strong><br><code>${esc(m.code)}</code><br><span class="tag ${m.checked_in?'g':''}">${m.checked_in?'Checked in':'Not used'}</span></div></div>`).join('')}<div class="note">Show this QR at the door. Don’t share it: one ticket, one entry.</div></section>`;
  }
  return h;
}

function orgView(){
  if(!user)return `<h2 style="font-size:34px">Organizer login</h2><div class="panel" style="margin-top:14px;max-width:420px"><label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><div style="margin-top:16px"><button class="btn" data-act="login">Log in</button></div><div class="note">Organizer accounts are created by the site owner.</div></div>`;
  const ap=D.mem.filter(m=>m.status==='approved'),pend=D.mem.filter(m=>m.status==='pending');
  let rev=0,cut=0;ap.forEach(m=>{const s=sqOf(m.squad_id),e=s&&evOf(s.event_id),pr=mPrice(m);rev+=pr;if(e)cut+=pr*e.commission/100});
  const f=[['Opened a squad link',D.views],['Squads started',D.sq.length],['Squads that reached 5',D.sq.filter(s=>mOf(s).length>=5).length],['Squads that reached 10',D.sq.filter(s=>mOf(s).length>=10).length],['Squads locked',D.sq.filter(s=>s.locked).length],['Tickets paid',ap.length],['Checked in at the door',ap.filter(m=>m.checked_in).length]];
  let h=`<div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="font-size:34px">Organizer dashboard</h2><button class="btn alt sm" data-act="logout">Log out</button></div>
  <div class="stats"><div class="stat"><b>${ap.length}</b><span>paid tickets</span></div><div class="stat"><b>${inr(rev)}</b><span>revenue</span></div><div class="stat"><b>${inr(Math.round(cut))}</b><span>platform cut</span></div><div class="stat"><b>${pend.length}</b><span>awaiting approval</span></div></div>
  <section class="panel"><h3 style="font-size:20px;margin-bottom:10px">Pending payments</h3>${pend.length?pend.map(m=>{const s=sqOf(m.squad_id),e=s&&evOf(s.event_id);return `<div class="mem"><span>${esc(m.name)} <span class="meta">· ${esc(s?s.name:'')} · ${esc(e?e.name:'')} · ${inr(mPrice(m))}</span></span><span class="row"><button class="btn sm" data-act="approve" data-id="${m.id}">Approve</button><button class="btn alt sm" data-act="reject" data-id="${m.id}">Reject</button></span></div>`}).join(''):'<div class="meta">Nothing waiting. Match each payment against your UPI app before approving.</div>'}</section>
  <section class="panel"><h3 style="font-size:20px;margin-bottom:10px">Entry scanner</h3><div class="row"><button class="btn" data-act="scan">Open camera</button><button class="btn alt" data-act="stopscan">Stop</button></div><div id="reader"></div>
  <div class="row" style="margin-top:12px"><input id="mc" placeholder="Or type a code" aria-label="Ticket code"><button class="btn alt" data-act="manual">Check in</button></div><div class="msg" id="scanmsg"></div></section>
  <section class="panel"><h3 style="font-size:20px;margin-bottom:10px">Funnel</h3>${f.map((x,i)=>`<div class="mem"><span>${x[0]}</span><strong>${x[1]}${i&&f[i-1][1]?` <span class="meta">(${Math.round(x[1]/f[i-1][1]*100)}%)</span>`:''}</strong></div>`).join('')}<div class="note">Percentages compare each step to the one before it.</div></section>
  <section class="panel"><h3 style="font-size:20px;margin-bottom:10px">Payment QR</h3><p class="meta">Upload your UPI QR. Students see it when they pay.</p>${D.qr?`<img class="pqr" src="${esc(D.qr)}" alt="Payment QR">`:''}<div class="row"><input type="file" id="qrf" accept="image/*" aria-label="Upload payment QR">${D.qr?'<button class="btn alt sm" data-act="rmqr">Remove</button>':''}</div></section>
  <section class="panel"><h3 style="font-size:20px">Create an event</h3><label for="en">Name</label><input id="en"><div class="row"><div style="flex:1 1 140px"><label for="ed">Date</label><input id="ed" type="date"></div><div style="flex:1 1 140px"><label for="ev">Venue</label><input id="ev"></div></div>
  <div class="row"><div style="flex:1 1 100px"><label for="ep">Price (₹)</label><input id="ep" type="number" min="1"></div><div style="flex:1 1 100px"><label for="ec">Capacity</label><input id="ec" type="number" min="1"></div></div>
  <div class="row"><div style="flex:1 1 90px"><label for="e5">5+ off %</label><input id="e5" type="number" value="10" min="0" max="90"></div><div style="flex:1 1 90px"><label for="e10">10+ off %</label><input id="e10" type="number" value="20" min="0" max="90"></div><div style="flex:1 1 90px"><label for="ek">Your cut %</label><input id="ek" type="number" value="10" min="0" max="50"></div></div>
  <div style="margin-top:16px"><button class="btn" data-act="mkev">Create event</button></div></section>
  <section class="panel"><h3 style="font-size:20px;margin-bottom:10px">Events</h3>${D.ev.map(e=>`<div class="mem"><span>${esc(e.name)} <span class="meta">· ${e.date} · ${inr(e.price)}</span></span><button class="btn alt sm" data-act="rmev" data-id="${e.id}">Delete</button></div>`).join('')||'<div class="meta">No events yet.</div>'}</section>`;
  return h;
}

function paint(){
  const y=window.scrollY,h=cur();
  if(scanner&&h!=='organizer'){try{scanner.stop()}catch(e){}scanner=null}
  const app=$('#app');
  try{
    if(h==='organizer')app.innerHTML=orgView();
    else if(h.startsWith('squad-')){const s=sqOf(h.slice(6));app.innerHTML=s?sqView(s):'<div class="panel">That squad link isn’t valid or was removed. <a href="#events" style="color:var(--pink)">See events</a></div>'}
    else app.innerHTML=evView();
  }catch(e){app.innerHTML='<div class="panel">Something went wrong showing this page. Please refresh.</div>'}
  $('#n1').setAttribute('aria-current',h!=='organizer');$('#n2').setAttribute('aria-current',h==='organizer');
  try{document.querySelectorAll('canvas[data-t]').forEach(c=>QRCode.toCanvas(c,c.dataset.t,{width:120,margin:1}))}catch(e){}
  window.scrollTo(0,h===lastR?y:0);lastR=h;
}
function modal(html){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="md" role="dialog" aria-modal="true">'+html+'</div>';document.body.appendChild(o);const close=()=>o.remove();o.addEventListener('click',e=>{if(e.target===o)close()});o.onkeydown=e=>{if(e.key==='Escape')close()};return{o,close}}
const curSq=()=>sqOf(cur().slice(6));

const A={
  newsq(id){const e=evOf(id);const m=modal(`<h3>Start a squad</h3><div class="meta">${esc(e.name)}</div><label for="ln">Your name</label><input id="ln" autocomplete="name"><label for="sn">Squad name</label><input id="sn" placeholder="e.g. Hostel H gang"><div class="row" style="margin-top:22px"><button class="btn" id="go1">Create squad</button><button class="btn alt" id="cx">Cancel</button></div>`);
    const ln=m.o.querySelector('#ln'),sn=m.o.querySelector('#sn');ln.focus();
    const go=()=>act(async()=>{const leader=ln.value.trim();if(!leader){ln.focus();return}
      const r=await db.from('squads').insert({event_id:id,name:sn.value.trim()||leader+'’s squad',leader}).select().single();if(r.error)throw r.error;
      const r2=await db.from('members').insert({squad_id:r.data.id,name:leader});if(r2.error)throw r2.error;
      m.close();await load();location.hash='squad-'+r.data.id;paint()});
    m.o.querySelector('#go1').onclick=go;m.o.querySelector('#cx').onclick=m.close;m.o.onkeydown=k=>{if(k.key==='Escape')m.close();if(k.key==='Enter')go()}},
  async add(){const s=curSq(),n=$('#fn').value.trim();if(!n)return;if(mOf(s).length>=40)throw new Error('This squad is full.');
    const r=await db.from('members').insert({squad_id:s.id,name:n});if(r.error)throw r.error;await refresh()},
  async copy(){let ok=false;try{await navigator.clipboard.writeText(location.href);ok=true}catch(e){}$('#msg').textContent=ok?'Link copied. Send it to your group chat.':'Copy this link: '+location.href},
  async lock(){const s=curSq(),r=await db.from('squads').update({locked:true}).eq('id',s.id);if(r.error)throw r.error;await refresh()},
  async move(){const s=curSq(),r=await db.from('squads').update({event_id:$('#sw').value}).eq('id',s.id);if(r.error)throw r.error;await refresh()},
  pay(id){const mm=D.mem.find(x=>x.id===id),s=sqOf(mm.squad_id),p=price(evOf(s.event_id),mOf(s).length);
    if(!D.qr){modal(`<h3>Not ready yet</h3><p class="meta">The organizer hasn’t added a payment QR yet. Try again soon.</p>`).o.onclick=e=>e.currentTarget.remove();return}
    const m=modal(`<h3>Pay ${inr(p)}</h3><div class="meta">${esc(mm.name)} · ${esc(s.name)}</div><img class="pqr" src="${esc(D.qr)}" alt="Organizer payment QR"><p class="note">Scan with any UPI app and pay ${inr(p)}. Put “${esc(s.name)}” in the note. Tap the button after paying.</p><div class="row"><button class="btn" id="pd">I’ve paid</button><button class="btn alt" id="cx">Back</button></div>`);
    m.o.querySelector('#cx').onclick=m.close;
    m.o.querySelector('#pd').onclick=()=>act(async()=>{const r=await db.from('members').update({status:'pending'}).eq('id',id);if(r.error)throw r.error;m.close();await refresh()})},
  async approve(id){const r=await db.from('members').update({status:'approved'}).eq('id',id);if(r.error)throw r.error;await refresh()},
  async reject(id){const r=await db.from('members').update({status:'reserved'}).eq('id',id);if(r.error)throw r.error;await refresh()},
  async login(){const r=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error)throw new Error('Login failed: '+r.error.message);await refresh()},
  async logout(){await db.auth.signOut();user=null;D.views=0;paint()},
  async mkev(){const g=i=>$('#'+i).value.trim(),v={name:g('en'),date:g('ed'),venue:g('ev'),price:+g('ep'),cap:+g('ec'),pct5:+g('e5'),pct10:+g('e10'),commission:+g('ek')};
    if(!v.name||!v.date||!(v.price>0)||!(v.cap>0))throw new Error('Fill in name, date, price and capacity.');
    const r=await db.from('events').insert(v);if(r.error)throw r.error;await refresh();say('Event created.',true)},
  async rmev(id){if(!confirm('Delete this event and all its squads?'))return;const r=await db.from('events').delete().eq('id',id);if(r.error)throw r.error;await refresh()},
  async rmqr(){const r=await db.from('settings').update({qr:null}).eq('id',1);if(r.error)throw r.error;await refresh()},
  async scan(){if(scanner)return;scanner=new Html5Qrcode('reader');
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:220},txt=>{if(txt===lastScan)return;lastScan=txt;setTimeout(()=>lastScan='',3000);act(()=>checkin(txt))},()=>{}).catch(e=>{scanner=null;throw new Error('Camera not available. Allow camera access, or type the code instead.')})},
  async stopscan(){if(scanner){try{await scanner.stop()}catch(e){}scanner=null}},
  async manual(){await checkin($('#mc').value)}
};
async function checkin(raw){
  const c=String(raw||'').trim().toUpperCase(),el=$('#scanmsg'),m=D.mem.find(x=>x.code===c);let t;
  if(!m)t='No ticket with that code.';
  else if(m.status!=='approved')t=m.name+': payment not approved. Do not let them in.';
  else if(m.checked_in)t=m.name+' already checked in. Do not let them in again.';
  else{const r=await db.from('members').update({checked_in:true}).eq('id',m.id);if(r.error)throw r.error;m.checked_in=true;t='Welcome, '+m.name+'. Checked in.'}
  if(el)el.textContent=t;
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
  const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])act(()=>A[b.dataset.act](b.dataset.id));
});
document.addEventListener('change',e=>{
  if(e.target.id!=='qrf'||!e.target.files[0])return;
  act(()=>new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('Could not read that file.'));
    r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('That file is not a valid image.'));
      im.onload=async()=>{try{const k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        const u=await db.from('settings').update({qr:c.toDataURL('image/png')}).eq('id',1);if(u.error)throw u.error;await refresh();res()}catch(x){rej(x)}};im.src=r.result};
    r.readAsDataURL(e.target.files[0])}));
});
const seen=new Set();
window.addEventListener('hashchange',()=>{const h=cur();
  if(h.startsWith('squad-')&&db&&!seen.has(h)){seen.add(h);db.from('views').insert({squad_id:h.slice(6)}).then(()=>{},()=>{})}
  paint()});
setInterval(()=>{const a=document.activeElement;
  if(cur().startsWith('squad-')&&!document.querySelector('.ov')&&!(a&&/INPUT|SELECT/.test(a.tagName)))load().then(paint).catch(()=>{})},8000);
act(async()=>{await load();const h=cur();if(h.startsWith('squad-')&&!seen.has(h)){seen.add(h);db.from('views').insert({squad_id:h.slice(6)}).then(()=>{},()=>{})}paint()});
</script>
